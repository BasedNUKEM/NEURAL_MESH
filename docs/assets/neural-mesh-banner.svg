<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="NEURAL_MESH — self-organizing, self-forgetting agentic memory mesh">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#e879f9"/>
      <stop offset="1" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0e1830" stroke-width="1"/>
    </pattern>
    <radialGradient id="nodeC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#0891b2"/>
    </radialGradient>
    <radialGradient id="nodeM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0abfc"/><stop offset="1" stop-color="#c026d3"/>
    </radialGradient>
    <radialGradient id="nodeG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#16a34a"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="#070b12"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.6"/>

  <!-- matrix rain glyphs -->
  <g font-family="monospace" font-size="14" fill="#0e7490" opacity="0.8">
    <text x="40" y="0">0<animateTransform attributeName="transform" type="translate" from="0 -40" to="0 340" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite"/></text>
    <text x="180" y="0">1<animateTransform attributeName="transform" type="translate" from="0 -60" to="0 360" dur="7.5s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7.5s" begin="1s" repeatCount="indefinite"/></text>
    <text x="330" y="0">◆<animateTransform attributeName="transform" type="translate" from="0 -30" to="0 350" dur="5.5s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="5.5s" begin="2s" repeatCount="indefinite"/></text>
    <text x="470" y="0">▓<animateTransform attributeName="transform" type="translate" from="0 -50" to="0 370" dur="8s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8s" begin="0.5s" repeatCount="indefinite"/></text>
    <text x="620" y="0">0<animateTransform attributeName="transform" type="translate" from="0 -45" to="0 365" dur="6.5s" begin="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="6.5s" begin="3s" repeatCount="indefinite"/></text>
    <text x="760" y="0">1<animateTransform attributeName="transform" type="translate" from="0 -35" to="0 355" dur="7s" begin="1.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="7s" begin="1.5s" repeatCount="indefinite"/></text>
    <text x="920" y="0">◆<animateTransform attributeName="transform" type="translate" from="0 -55" to="0 375" dur="6s" begin="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="6s" begin="2.5s" repeatCount="indefinite"/></text>
    <text x="1060" y="0">▓<animateTransform attributeName="transform" type="translate" from="0 -40" to="0 360" dur="8.5s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8.5s" begin="0.8s" repeatCount="indefinite"/></text>
  </g>

  <!-- title -->
  <text x="600" y="112" text-anchor="middle" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="58" font-weight="bold" letter-spacing="8" fill="url(#titleGrad)" filter="url(#glow)">NEURAL_MESH</text>
  <rect x="958" y="76" width="14" height="52" fill="#4ade80">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="152" text-anchor="middle" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="17" letter-spacing="3" fill="#7dd3fc">SELF-ORGANIZING · SELF-FORGETTING · AGENTIC MEMORY MESH</text>
  <text x="600" y="176" text-anchor="middle" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="13" letter-spacing="2" fill="#64748b">FOR AGENTS, BY AGENTS — v0.21.0 · RUST-ACCELERATED · MIT</text>

  <!-- neural mesh band -->
  <g stroke-width="1.6" fill="none" opacity="0.85">
    <!-- row1 -->
    <g stroke="#164e63"><path d="M100 225 L200 205"/><path d="M200 205 L300 230"/><path d="M300 230 L400 210"/><path d="M400 210 L500 235"/><path d="M500 235 L600 215"/><path d="M600 215 L700 240"/><path d="M700 240 L800 220"/><path d="M800 220 L900 245"/><path d="M900 245 L1000 225"/><path d="M1000 225 L1100 250"/></g>
    <!-- row2 -->
    <g stroke="#701a75"><path d="M150 275 L250 255"/><path d="M250 255 L350 280"/><path d="M350 280 L450 260"/><path d="M450 260 L550 285"/><path d="M550 285 L650 265"/><path d="M650 265 L750 290"/><path d="M750 290 L850 270"/><path d="M850 270 L950 295"/><path d="M950 295 L1050 275"/></g>
    <!-- verticals -->
    <g stroke="#365314"><path d="M100 225 L150 275"/><path d="M200 205 L250 255"/><path d="M300 230 L350 280"/><path d="M400 210 L450 260"/><path d="M500 235 L550 285"/><path d="M600 215 L650 265"/><path d="M700 240 L750 290"/><path d="M800 220 L850 270"/><path d="M900 245 L950 295"/><path d="M1000 225 L1050 275"/></g>
    <!-- flowing pulses on edges -->
    <g stroke="#22d3ee" stroke-dasharray="6 30" opacity="0.9">
      <path d="M100 225 L200 205"><animate attributeName="stroke-dashoffset" from="36" to="-36" dur="2.2s" repeatCount="indefinite"/></path>
      <path d="M200 205 L300 230"><animate attributeName="stroke-dashoffset" from="36" to="-36" dur="2.2s" begin="0.4s" repeatCount="indefinite"/></path>
      <path d="M300 230 L400 210"><animate attributeName="stroke-dashoffset" from="36" to="-36" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></path>
      <path d="M400 210 L500 235"><animate attributeName="stroke-dashoffset" from="36" to="-36" dur="2.2s" begin="1.2s" repeatCount="indefinite"/></path>
      <path d="M500 235 L600 215"><animate attributeName="stroke-dashoffset" from="36" to="-36" dur="2.2s" begin="1.6s" repeatCount="indefinite"/></path>
      <path d="M600 215 L700 240"><animate attributeName="stroke-dashoffset" from="36" to="-36" dur="2.2s" begin="0.2s" repeatCount="indefinite"/></path>
      <path d="M700 240 L800 220"><animate attributeName="stroke-dashoffset" from="36" to="-36" dur="2.2s" begin="0.6s" repeatCount="indefinite"/></path>
      <path d="M800 220 L900 245"><animate attributeName="stroke-dashoffset" from="36" to="-36" dur="2.2s" begin="1s" repeatCount="indefinite"/></path>
      <path d="M900 245 L1000 225"><animate attributeName="stroke-dashoffset" from="36" to="-36" dur="2.2s" begin="1.4s" repeatCount="indefinite"/></path>
      <path d="M1000 225 L1100 250"><animate attributeName="stroke-dashoffset" from="36" to="-36" dur="2.2s" begin="1.8s" repeatCount="indefinite"/></path>
      <path d="M150 275 L250 255"><animate attributeName="stroke-dashoffset" from="36" to="-36" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></path>
      <path d="M400 210 L450 260"><animate attributeName="stroke-dashoffset" from="36" to="-36" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></path>
      <path d="M700 240 L750 290"><animate attributeName="stroke-dashoffset" from="36" to="-36" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></path>
      <path d="M1000 225 L1050 275"><animate attributeName="stroke-dashoffset" from="36" to="-36" dur="2.6s" begin="1.7s" repeatCount="indefinite"/></path>
    </g>
  </g>

  <!-- nodes row1 -->
  <circle cx="100" cy="225" r="5" fill="url(#nodeC)"><animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="205" r="5" fill="url(#nodeM)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="300" cy="230" r="5" fill="url(#nodeG)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="400" cy="210" r="5" fill="url(#nodeC)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="235" r="5" fill="url(#nodeM)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="600" cy="215" r="5" fill="url(#nodeG)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="240" r="5" fill="url(#nodeC)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="800" cy="220" r="5" fill="url(#nodeM)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="900" cy="245" r="5" fill="url(#nodeG)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="0.15s" repeatCount="indefinite"/></circle>
  <circle cx="1000" cy="225" r="5" fill="url(#nodeC)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="0.45s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="250" r="5" fill="url(#nodeM)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="0.75s" repeatCount="indefinite"/></circle>

  <!-- nodes row2 -->
  <circle cx="150" cy="275" r="5" fill="url(#nodeM)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="1.05s" repeatCount="indefinite"/></circle>
  <circle cx="250" cy="255" r="5" fill="url(#nodeG)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="1.35s" repeatCount="indefinite"/></circle>
  <circle cx="350" cy="280" r="5" fill="url(#nodeC)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="1.65s" repeatCount="indefinite"/></circle>
  <circle cx="450" cy="260" r="5" fill="url(#nodeM)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="1.95s" repeatCount="indefinite"/></circle>
  <circle cx="550" cy="285" r="5" fill="url(#nodeG)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></circle>
  <circle cx="650" cy="265" r="5" fill="url(#nodeC)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="750" cy="290" r="5" fill="url(#nodeM)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="270" r="5" fill="url(#nodeG)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle>
  <circle cx="950" cy="295" r="5" fill="url(#nodeC)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="1050" cy="275" r="5" fill="url(#nodeM)"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle>

  <!-- pixel corner brackets -->
  <g stroke="#4ade80" stroke-width="2" fill="none" opacity="0.7">
    <path d="M20 20 h24"/><path d="M20 20 v24"/>
    <path d="M1180 20 h-24"/><path d="M1180 20 v24"/>
    <path d="M20 300 h24"/><path d="M20 300 v-24"/>
    <path d="M1180 300 h-24"/><path d="M1180 300 v-24"/>
  </g>
</svg>
