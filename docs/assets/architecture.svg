<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="NEURAL_MESH architecture: ingest, mesh, sleep, resonance, context">
  <defs>
    <linearGradient id="boxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a2e"/><stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <filter id="boxGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="#070b12"/>
  <text x="600" y="34" text-anchor="middle" font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace" font-size="20" font-weight="bold" letter-spacing="4" fill="#e2e8f0">HOW THE MESH THINKS</text>

  <!-- flow boxes -->
  <g font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace">
    <rect x="30"  y="58"  width="150" height="54" rx="8" fill="url(#boxGrad)" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="215" y="58"  width="160" height="54" rx="8" fill="url(#boxGrad)" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="410" y="58"  width="160" height="54" rx="8" fill="url(#boxGrad)" stroke="#e879f9" stroke-width="1.5"/>
    <rect x="605" y="58"  width="170" height="54" rx="8" fill="url(#boxGrad)" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="810" y="58"  width="170" height="54" rx="8" fill="url(#boxGrad)" stroke="#22d3ee" stroke-width="1.5"/>
    <rect x="1015" y="58" width="160" height="54" rx="8" fill="url(#boxGrad)" stroke="#4ade80" stroke-width="1.5"/>

    <text x="105" y="82"  text-anchor="middle" font-size="15" fill="#7dd3fc">AGENT</text>
    <text x="105" y="101" text-anchor="middle" font-size="11" fill="#64748b">you / your tools</text>
    <text x="295" y="82"  text-anchor="middle" font-size="15" fill="#86efac">INGEST</text>
    <text x="295" y="101" text-anchor="middle" font-size="11" fill="#64748b">typed write + auto-link</text>
    <text x="490" y="82"  text-anchor="middle" font-size="15" fill="#f0abfc">MESH</text>
    <text x="490" y="101" text-anchor="middle" font-size="11" fill="#64748b">nodes self-link by meaning</text>
    <text x="690" y="82"  text-anchor="middle" font-size="15" fill="#fcd34d">SLEEP / DREAM</text>
    <text x="690" y="101" text-anchor="middle" font-size="11" fill="#64748b">replay · strengthen · prune</text>
    <text x="895" y="82"  text-anchor="middle" font-size="15" fill="#7dd3fc">RESONANCE</text>
    <text x="895" y="101" text-anchor="middle" font-size="11" fill="#64748b">seed → spread → decay</text>
    <text x="1095" y="82" text-anchor="middle" font-size="15" fill="#86efac">CONTEXT</text>
    <text x="1095" y="101" text-anchor="middle" font-size="11" fill="#64748b">current + relevant only</text>

    <!-- animated arrows -->
    <g stroke="#22d3ee" stroke-width="2.5" fill="none" stroke-dasharray="8 10" opacity="0.9">
      <path d="M180 85 L213 85"><animate attributeName="stroke-dashoffset" from="18" to="-18" dur="1.2s" repeatCount="indefinite"/></path>
      <path d="M375 85 L408 85"><animate attributeName="stroke-dashoffset" from="18" to="-18" dur="1.2s" begin="0.2s" repeatCount="indefinite"/></path>
      <path d="M570 85 L603 85"><animate attributeName="stroke-dashoffset" from="18" to="-18" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></path>
      <path d="M775 85 L808 85"><animate attributeName="stroke-dashoffset" from="18" to="-18" dur="1.2s" begin="0.6s" repeatCount="indefinite"/></path>
      <path d="M980 85 L1013 85"><animate attributeName="stroke-dashoffset" from="18" to="-18" dur="1.2s" begin="0.8s" repeatCount="indefinite"/></path>
    </g>
  </g>

  <!-- panel: INGEST -->
  <g font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace">
    <rect x="30" y="140" width="330" height="280" rx="10" fill="#0a101d" stroke="#1e293b"/>
    <text x="48" y="166" font-size="13" fill="#94a3b8">▸ FIVE MEMORY TYPES</text>
    <g font-size="12">
      <rect x="48" y="180" width="90" height="24" rx="4" fill="#164e63" stroke="#22d3ee"/><text x="93" y="196" text-anchor="middle" fill="#a5f3fc">semantic</text>
      <rect x="146" y="180" width="90" height="24" rx="4" fill="#164e63" stroke="#22d3ee"/><text x="191" y="196" text-anchor="middle" fill="#a5f3fc">episodic</text>
      <rect x="244" y="180" width="96" height="24" rx="4" fill="#164e63" stroke="#22d3ee"/><text x="292" y="196" text-anchor="middle" fill="#a5f3fc">procedural</text>
      <rect x="48" y="212" width="90" height="24" rx="4" fill="#164e63" stroke="#22d3ee"/><text x="93" y="228" text-anchor="middle" fill="#a5f3fc">sensory</text>
      <rect x="146" y="212" width="100" height="24" rx="4" fill="#164e63" stroke="#22d3ee"/><text x="196" y="228" text-anchor="middle" fill="#a5f3fc">prospective</text>
      <text x="254" y="228" fill="#64748b">futures, not past</text>
    </g>
    <text x="48" y="262" font-size="13" fill="#94a3b8">▸ BIG OUTPUT? POINTER IT</text>
    <rect x="48" y="274" width="220" height="26" rx="4" fill="#1e1b4b" stroke="#818cf8"/>
    <text x="158" y="291" text-anchor="middle" font-size="12" fill="#c7d2fe">200 KB log → mesh://… 36 bytes</text>
    <text x="48" y="326" font-size="13" fill="#94a3b8">▸ AUTO-LINK ON INGEST</text>
    <text x="48" y="348" font-size="12" fill="#475569">nearest neighbours by meaning →</text>
    <text x="48" y="366" font-size="12" fill="#475569">HippoRAG-style hippocampal index</text>
    <text x="48" y="396" font-size="12" fill="#64748b">lane: hot (working) · cold (durable)</text>
  </g>

  <!-- panel: MESH mini graph -->
  <g font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace">
    <rect x="385" y="140" width="330" height="280" rx="10" fill="#0a101d" stroke="#1e293b"/>
    <text x="403" y="166" font-size="13" fill="#94a3b8">▸ MESH TOPOLOGY — MEANING LIVES IN EDGES</text>
    <g stroke="#334155" stroke-width="1.2">
      <line x1="470" y1="205" x2="540" y2="185"/><line x1="540" y1="185" x2="610" y2="215"/>
      <line x1="610" y1="215" x2="620" y2="275"/><line x1="470" y1="205" x2="500" y2="270"/>
      <line x1="540" y1="185" x2="520" y2="250"/><line x1="500" y1="270" x2="560" y2="290"/>
      <line x1="520" y1="250" x2="580" y2="265"/><line x1="560" y1="290" x2="620" y2="275"/>
      <line x1="610" y1="215" x2="650" y2="185"/><line x1="650" y1="185" x2="660" y2="250"/>
    </g>
    <g fill="#22d3ee"><circle cx="470" cy="205" r="6"/><circle cx="540" cy="185" r="6"><animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/></circle><circle cx="500" cy="270" r="6"/></g>
    <g fill="#e879f9"><circle cx="610" cy="215" r="6"/><circle cx="520" cy="250" r="6"/><circle cx="650" cy="185" r="6"><animate attributeName="r" values="5;8;5" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle></g>
    <g fill="#4ade80"><circle cx="620" cy="275" r="6"/><circle cx="560" cy="290" r="6"/><circle cx="580" cy="265" r="6"/><circle cx="660" cy="250" r="6"><animate attributeName="r" values="5;8;5" dur="2s" begin="1s" repeatCount="indefinite"/></circle></g>
    <text x="403" y="330" font-size="12" fill="#64748b">supersedes link → old fact soft-archived</text>
    <text x="403" y="352" font-size="12" fill="#64748b">retrieval skips it → agent sees only</text>
    <text x="403" y="370" font-size="12" fill="#4ade80">CURRENT truth</text>
    <text x="403" y="400" font-size="12" fill="#64748b">by= author on every node — know who</text>
    <text x="403" y="414" font-size="12" fill="#64748b">remembered, not just when</text>
  </g>

  <!-- panel: SLEEP -->
  <g font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace">
    <rect x="740" y="140" width="330" height="280" rx="10" fill="#0a101d" stroke="#1e293b"/>
    <text x="758" y="166" font-size="13" fill="#94a3b8">▸ SLEEP — FORGET ON PURPOSE</text>
    <g font-size="12">
      <rect x="758" y="182" width="110" height="26" rx="4" fill="#78350f" stroke="#fbbf24"/><text x="813" y="199" text-anchor="middle" fill="#fde68a">replay</text>
      <text x="884" y="199" fill="#475569">→</text>
      <rect x="900" y="182" width="120" height="26" rx="4" fill="#78350f" stroke="#fbbf24"/><text x="960" y="199" text-anchor="middle" fill="#fde68a">strengthen</text>
      <text x="1036" y="199" fill="#475569">→</text>
      <rect x="1052" y="182" width="0" height="0" rx="0" fill="none"/>
      <rect x="758" y="220" width="120" height="26" rx="4" fill="#7f1d1d" stroke="#f87171"/><text x="818" y="237" text-anchor="middle" fill="#fecaca">prune weak/old</text>
      <rect x="892" y="220" width="120" height="26" rx="4" fill="#7f1d1d" stroke="#f87171"/><text x="952" y="237" text-anchor="middle" fill="#fecaca">low-trust</text>
    </g>
    <text x="758" y="282" font-size="13" fill="#94a3b8">▸ DREAM — REFLECT + MUSE</text>
    <g font-size="11" fill="#475569">
      <text x="758" y="302">D drift · R reinforce · E evaluate</text>
      <text x="758" y="320">A archive · M muse → insights minted</text>
      <text x="758" y="338" fill="#a78bfa">by="dream" — the mesh learns about itself</text>
    </g>
    <text x="758" y="376" font-size="12" fill="#64748b">consolidation bus:</text>
    <rect x="758" y="388" width="90" height="24" rx="12" fill="#155e75" stroke="#22d3ee"/><text x="803" y="404" text-anchor="middle" font-size="11" fill="#a5f3fc">HOT lane</text>
    <text x="862" y="404" font-size="11" fill="#475569">──►</text>
    <rect x="898" y="388" width="100" height="24" rx="12" fill="#86198f" stroke="#e879f9"/><text x="948" y="404" text-anchor="middle" font-size="11" fill="#f5d0fe">COLD lane</text>
  </g>

  <!-- bottom strip -->
  <g font-family="'DejaVu Sans Mono',Menlo,Consolas,monospace">
    <rect x="30" y="452" width="1145" height="46" rx="8" fill="#0a101d" stroke="#22d3ee" opacity="0.9"/>
    <text x="50" y="480" font-size="13" fill="#7dd3fc">⚡ RESONANCE RETRIEVAL</text>
    <text x="290" y="480" font-size="13" fill="#475569">query seeds nodes → activation spreads across links with decay → re-rank by relevance + recency + trust → you get the CLUSTER, not a lonely singleton</text>
    <text x="1015" y="480" font-size="13" fill="#4ade80">RUST ⚡ 1.63× FASTER · EXACT PARITY</text>
  </g>
</svg>
