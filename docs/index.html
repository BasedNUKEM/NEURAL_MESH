let nodeMap = {};

async function fetchMesh() {
  try {
    let statsRes = STATIC_SNAPSHOT.stats;
    let pubRes = {results: STATIC_SNAPSHOT.results};
    try {
      const live = await Promise.all([
        fetch(API+'/stats').then(r=>{if(!r.ok) throw new Error('offline'); return r.json()}),
        fetch(API+'/public?limit=80').then(r=>{if(!r.ok) throw new Error('offline'); return r.json()})
      ]);
      statsRes = live[0]; pubRes = live[1];
    } catch (_) { /* GitHub Pages: render sanitized release snapshot */ }
    meshData.stats = statsRes;
    const results = pubRes.results || [];

    // Build node list
    nodeMap = {};
    meshData.nodes = results.map((n, i) => {
      // Position nodes on a Fibonacci sphere for brain-like layout
      const phi = Math.acos(1 - 2*(i+0.5)/Math.max(results.length, 1));
      const theta = Math.PI * (1+Math.sqrt(5)) * i;
      const r = 180 + Math.random()*20; // slight radial variation
      const x = r * Math.sin(phi) * Math.cos(theta);
      const y = r * Math.sin(phi) * Math.sin(theta);
      const z = r * Math.cos(phi);

      const node = {
        id: n.id,
        content: n.content || '',
        type: n.type || 'semantic',
        provenance: n.provenance || 'unknown',
        trust: Number(n.trust || 1.0),
        lane: n.lane || (i % 3 === 0 ? 'cold' : 'hot'), // approximate
        helixa: n.helixa || null,
        by: n.by || 'unknown',
        tx: x, ty: y, tz: z, // target position
        x: 0, y: 0, z: 0,    // current (animated)
        size: 4 + (Number(n.trust || 1.0) * 4),
        glow: 0,
        pulse: Math.random() * Math.PI * 2
      };
      nodeMap[n.id] = node;
      return node;
    });

    // Build links from mesh proximity (pairs that share provenance or helixa)
    meshData.links = [];
    const seen = new Set();
    for (let i = 0; i < meshData.nodes.length; i++) {
      for (let j = i+1; j < meshData.nodes.length; j++) {
        const a = meshData.nodes[i], b = meshData.nodes[j];
        const key = a.id+':'+b.id;
        if (seen.has(key)) continue;

        let strength = 0;
        if (a.provenance === b.provenance && a.provenance !== 'unknown') strength = 0.6;
        if (a.helixa && b.helixa && a.helixa === b.helixa) strength = 0.9;
        if (a.lane === b.lane && a.trust > 0.7 && b.trust > 0.7) strength = Math.max(strength, 0.4);

        if (strength > 0.3) {
          seen.add(key);
          meshData.links.push({ a: a.id, b: b.id, strength });
        }
      }
    }

    // Update HUD
    document.getElementById('nodes-val').textContent = meshData.nodes.length;
    document.getElementById('hot-val').textContent = meshData.nodes.filter(n=>n.lane==='hot').length;
    document.getElementById('cold-val').textContent = meshData.nodes.filter(n=>n.lane==='cold').length;
    document.getElementById('links-val').textContent = meshData.links.length;
    document.getElementById('version').textContent = 'v'+statsRes.version;

  } catch(e) {
    console.warn('Mesh fetch:', e.message);
  }
}

// ── p5.js 3D Brain ──────────────────────────────────────────────
let camTheta = 0, camPhi = 0.6, camDist = 500;
let targetTheta = 0, targetPhi = 0.6, targetDist = 500;
let hoveredNode = null;
let particles = [];
let lastFetch = 0;

function setup() {
  const c = createCanvas(windowWidth, windowHeight, WEBGL);
  c.position(0,0);
  c.style('position','fixed');
  c.style('top','0');
  c.style('left','0');
  pixelDensity(1);
  colorMode(HSB, 360, 100, 100, 100);
  noStroke();

  fetchMesh().then(() => {
    // init node positions to targets
    for (let n of meshData.nodes) { n.x=n.tx; n.y=n.ty; n.z=n.tz; }
    for (let i=0; i<Math.min(meshData.links.length*2, 200); i++) {
      particles.push(spawnParticle());
    }
  });
}

function draw() {
  // Auto-refresh every 30s
  if (millis() - lastFetch > 30000) { lastFetch = millis(); fetchMesh().then(()=>{
    for (let i=0; i<Math.min(meshData.links.length*2,200); i++) {
      if (particles.length<200) particles.push(spawnParticle());
    }
  }); }

  // Smooth camera
  camTheta += (targetTheta - camTheta)*0.05;
  camPhi += (targetPhi - camPhi)*0.05;
  camDist += (targetDist - camDist)*0.08;

  background(8,9,10);

  // Ambient starfield
  push();
  translate(0,0,-300);
  for (let i=0; i<60; i++) {
    let sx = ((i*137.5)%width)-width/2;
    let sy = ((i*271.8)%height)-height/2;
    let sz = ((i*73.1)%400)-200;
    let flicker = 20+10*sin(millis()*0.001+i);
    fill(220,10,flicker, 30);
    ellipse(sx,sy,1.5,1.5);
  }
  pop();

  // Camera
  let cx = camDist * sin(camPhi) * cos(camTheta);
  let cy = camDist * sin(camPhi) * sin(camTheta);
  let cz = camDist * cos(camPhi);
  camera(cx, cy, cz, 0, 0, 0, 0, 1, 0);

  // Ambient light
  ambientLight(220,5,8);

  // Draw connections
  for (let link of meshData.links) {
    let a = nodeMap[link.a], b = nodeMap[link.b];
    if (!a || !b) continue;
    let alpha = map(link.strength,0.3,1,15,50);
    let hue = a.lane==='hot'&&b.lane==='hot' ? 18 : a.lane==='cold'&&b.lane==='cold' ? 205 : 260;
    strokeWeight(0.5);
    stroke(hue, 60, 80, alpha);
    line(a.x, a.y, a.z, b.x, b.y, b.z);
  }

  // Particles along links
  noStroke();
  for (let p of particles) {
    let link = meshData.links[p.linkIdx];
    if (!link) { p = spawnParticle(); continue; }
    let a = nodeMap[link.a], b = nodeMap[link.b];
    if (!a || !b) continue;
    p.t += 0.003 * (0.5+p.speed);
    if (p.t > 1) { Object.assign(p, spawnParticle()); continue; }
    let px = lerp(a.x, b.x, p.t);
    let py = lerp(a.y, b.y, p.t);
    let pz = lerp(a.z, b.z, p.t);
    let hue = a.lane==='hot' ? 18 : a.lane==='cold' ? 205 : 260;
    fill(hue, 40, 95, 70);
    push(); translate(px, py, pz); sphere(1.2); pop();
  }

  // Hover detection ray
  hoveredNode = null;
  let closestDist = 30;

  // Draw nodes
  for (let n of meshData.nodes) {
    // Animate toward target
    n.x += (n.tx - n.x)*0.03;
    n.y += (n.ty - n.y)*0.03;
    n.z += (n.tz - n.z)*0.03;

    // Pulse
    n.pulse += 0.02;
    let pulseScale = 1 + 0.15*sin(n.pulse);

    // Color by lane
    let hue, sat, bri;
    if (n.lane === 'hot') { hue=18; sat=85; bri=90; }
    else if (n.lane === 'cold') { hue=205; sat=70; bri=85; }
    else { hue=260; sat=60; bri=80; }

    // Trust affects glow
    let glowAlpha = map(n.trust, 0, 1, 10, 40);
    n.glow += (glowAlpha - n.glow)*0.1;

    // Outer glow
    push();
    translate(n.x, n.y, n.z);
    fill(hue, sat*0.4, bri*0.3, n.glow*0.3);
    sphere(n.size * pulseScale * 1.8);
    pop();

    // Core
    push();
    translate(n.x, n.y, n.z);
    // Specular-like highlight
    let lightHue = (hue+15)%360;
    fill(hue, sat, bri, 90);
    noStroke();
    sphere(n.size * pulseScale);
    // Inner bright spot
    fill(lightHue, sat*0.3, 100, 60);
    sphere(n.size * pulseScale * 0.45);
    pop();

    // Hover check (2D projection)
    let sx = screenX(n.x, n.y, n.z);
    let sy = screenY(n.x, n.y, n.z);
    if (sx>0 && sx<width && sy>0 && sy<height) {
      let d = dist(mouseX, mouseY, sx, sy);
      if (d < n.size*1.5 && d < closestDist) {
        closestDist = d;
        hoveredNode = n;
      }
    }
  }

  // Highlight hovered
  if (hoveredNode) {
    push();
    translate(hoveredNode.x, hoveredNode.y, hoveredNode.z);
    stroke(200,10,95,180);
    strokeWeight(1.5);
    noFill();
    sphere(hoveredNode.size*2.2);
    pop();
    // Show tooltip
    let sx = screenX(hoveredNode.x, hoveredNode.y, hoveredNode.z);
    let sy = screenY(hoveredNode.x, hoveredNode.y, hoveredNode.z);
    let tip = document.getElementById('tooltip');
    tip.style.display = 'block';
    tip.style.left = (sx+20)+'px';
    tip.style.top = (sy-10)+'px';
    tip.innerHTML = `
      <div class="tt-id">${hoveredNode.id.substring(0,16)}…  ·  ${hoveredNode.lane} lane  ·  trust ${hoveredNode.trust.toFixed(2)}</div>
      <div class="tt-content">${escapeHTML((hoveredNode.content||'').substring(0,180))}</div>
      <div class="tt-meta">${hoveredNode.provenance} · by ${hoveredNode.by}${hoveredNode.helixa?' · 🟦#'+hoveredNode.helixa:''}</div>
    `;
  } else {
    document.getElementById('tooltip').style.display = 'none';
  }
}

function escapeHTML(s) {
  return String(s).replace(/[&<>'"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

function spawnParticle() {
  if (meshData.links.length===0) return {linkIdx:0, t:random(), speed:random(0.4,1.6)};
  return {linkIdx:floor(random(meshData.links.length)), t:random(), speed:random(0.3,1.8)};
}

function mouseDragged() {
  targetTheta -= (mouseX-pmouseX)*0.005;
  targetPhi = constrain(targetPhi-(mouseY-pmouseY)*0.005, 0.15, PI-0.15);
  return false;
}

function mouseWheel(e) {
  targetDist = constrain(targetDist + e.delta*0.5, 200, 900);
  return false;
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}
</script>
