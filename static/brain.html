<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── CAPTURE / query flags ──────────────────────
const CAPTURE = new URLSearchParams(location.search).has('capture');
if (CAPTURE) {
  // Hide all UI chrome for clean capture / OG frames
  ['hud', 'legend', 'brain-badge'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = 'none';
  });
  document.querySelector('.instructions').style.display = 'none';
}

// ── Data layer (real mesh) ─────────────────────
const API = '/mesh';
let meshData = { nodes: [], links: [], stats: {} };
let nodeMap = {};       // id -> {three: mesh, data: {...}}
let linkLines = [];     // THREE.Line objects for mesh links
let linkGroup = new THREE.Group();

async function fetchMesh() {
  try {
    const [statsRes, pubRes] = await Promise.all([
      fetch(API+'/stats').then(r=>r.json()),
      fetch(API+'/public?limit=80').then(r=>r.json())
    ]);
    meshData.stats = statsRes;
    const results = pubRes.results || [];

    // Lane approximation (public API has no lane field — infer like v1 brain)
    const laneFor = (i) => i % 3 === 0 ? 'cold' : 'hot';
    const colorFor = (lane) => lane === 'hot' ? 0xff6b35 : lane === 'cold' ? 0x4dabf7 : 0x9775fa;
    const seen = new Set();
    const nodes = results.map((n, i) => {
      const phi = Math.acos(1 - 2*(i+0.5)/Math.max(results.length, 1));
      const theta = Math.PI * (1+Math.sqrt(5)) * i;
      const r = 1.9 + Math.random()*1.6;
      return {
        id: n.id, content: n.content || '', type: n.type || 'semantic',
        provenance: n.provenance || 'unknown', trust: Number(n.trust || 1.0),
        lane: n.lane || laneFor(i), helixa: n.helixa || null, by: n.by || 'unknown',
        x: r * Math.sin(phi) * Math.cos(theta),
        y: r * Math.sin(phi) * Math.sin(theta) * 0.8,
        z: r * Math.cos(phi),
        size: 0.04 + (Number(n.trust || 1.0) * 0.05),
        color: colorFor(n.lane || laneFor(i))
      };
    });
    nodeMap = {};
    meshData.nodes = nodes;

    // Links: shared provenance / helixa / same-lane high-trust
    meshData.links = [];
    const seenL = new Set();
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i+1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const key = a.id+':'+b.id;
        if (seenL.has(key)) continue;
        let strength = 0;
        if (a.provenance === b.provenance && a.provenance !== 'unknown') strength = 0.6;
        if (a.helixa && b.helixa && a.helixa === b.helixa) strength = 0.9;
        if (a.lane === b.lane && a.trust > 0.7 && b.trust > 0.7) strength = Math.max(strength, 0.4);
        if (strength > 0.3) { seenL.add(key); meshData.links.push({ a: a.id, b: b.id, strength }); }
      }
    }

    // Update HUD
    document.getElementById('nodes-val').textContent = nodes.length;
    document.getElementById('hot-val').textContent = nodes.filter(n=>n.lane==='hot').length;
    document.getElementById('cold-val').textContent = nodes.filter(n=>n.lane==='cold').length;
    document.getElementById('links-val').textContent = meshData.links.length;
    document.getElementById('version').textContent = 'v'+(statsRes.version||'0.21.0');

    buildMeshVisuals();
  } catch(e) {
    console.warn('Mesh fetch:', e.message);
  }
}

// Rebuild 3D visuals for mesh nodes + links
function buildMeshVisuals() {
  // Remove old mesh nodes
  while (meshGroup.children.length) meshGroup.remove(meshGroup.children[0]);
  nodeMap = {};
  for (const n of meshData.nodes) {
    const geo = new THREE.SphereGeometry(n.size, 16, 16);
    const mat = new THREE.MeshPhongMaterial({
      color: n.color, emissive: n.color, emissiveIntensity: 0.55,
      shininess: 60, specular: 0xffffff
    });
    const sphere = new THREE.Mesh(geo, mat);
    sphere.position.set(n.x, n.y, n.z);
    sphere.userData = { nodeId: n.id, phase: Math.random()*Math.PI*2, basePos: new THREE.Vector3(n.x, n.y, n.z) };
    meshGroup.add(sphere);
    nodeMap[n.id] = { three: sphere, data: n };
  }
  // Links
  while (linkGroup.children.length) linkGroup.remove(linkGroup.children[0]);
  linkLines = [];
  for (const l of meshData.links) {
    const a = nodeMap[l.a], b = nodeMap[l.b];
    if (!a || !b) continue;
    const geo = new THREE.BufferGeometry().setFromPoints([a.three.position, b.three.position]);
    const mat = new THREE.LineBasicMaterial({ color: 0x00E5FF, transparent: true, opacity: 0.12 + l.strength*0.15, blending: THREE.AdditiveBlending });
    const line = new THREE.Line(geo, mat);
    linkGroup.add(line);
    linkLines.push(line);
  }
  // Fire arrival pulses
  for (let i = 0; i < Math.min(meshData.nodes.length, 8); i++) {
    const n = meshData.nodes[Math.floor(Math.random()*meshData.nodes.length)];
    firePulse(new THREE.Vector3(n.x, n.y, n.z));
  }
}

// ── Theme ───────────────────────────────────────
const THEMES = [
  { bg: 0x000818, accent: 0x00E5FF, accent2: 0xff00aa, accent3: 0xffd700, name: 'CRYSTAL' },
  { bg: 0x0a001a, accent: 0xa855f7, accent2: 0xec4899, accent3: 0x818cf8, name: 'NEBULA' },
  { bg: 0x1a0a00, accent: 0xf97316, accent2: 0xef4444, accent3: 0xfbbf24, name: 'SUNSET' },
  { bg: 0x001020, accent: 0x22d3ee, accent2: 0x06b6d4, accent3: 0x67e8f9, name: 'OCEAN' },
];
let T = THEMES[0];
let frozen = false;
let pulseWaves = [];

// ─── CIRCUIT TEXTURE ────────────────────────────
function makeCircuitTexture(size, accentHex, alpha) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = `rgba(0,10,40,${alpha})`;
  ctx.fillRect(0, 0, size, size);
  const bs = size / 8;
  ctx.strokeStyle = 'rgba(0,229,255,0.12)';
  ctx.lineWidth = 0.5;
  for (let x = 0; x < size; x += bs)
    for (let y = 0; y < size; y += bs)
      ctx.strokeRect(x+1, y+1, bs-2, bs-2);
  ctx.strokeStyle = accentHex;
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 18; i++) {
    let y = Math.random() * size;
    ctx.beginPath(); ctx.moveTo(0, y); let x = 0;
    while (x < size * 0.95) {
      const seg = 20 + Math.random() * 80; x += seg; ctx.lineTo(x, y);
      if (Math.random() < 0.25) { const t = (Math.random()-0.5)*40; ctx.lineTo(x, y+t); y += t; }
    }
    ctx.stroke();
  }
  for (let i = 0; i < 12; i++) {
    let x = Math.random() * size; ctx.beginPath(); ctx.moveTo(x, 0); let y = 0;
    while (y < size * 0.95) {
      const seg = 15 + Math.random() * 60; y += seg; ctx.lineTo(x, y);
      if (Math.random() < 0.2) { const t = (Math.random()-0.5)*30; ctx.lineTo(x+t, y); x += t; }
    }
    ctx.stroke();
  }
  ctx.fillStyle = accentHex;
  for (let i = 0; i < 50; i++) { ctx.beginPath(); ctx.arc(Math.random()*size, Math.random()*size, 1.5+Math.random()*2.5, 0, Math.PI*2); ctx.fill(); }
  return new THREE.CanvasTexture(c);
}

// ─── SCENE ──────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(T.bg);
scene.fog = new THREE.FogExp2(T.bg, 0.00008);
const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.3, 100);
camera.position.set(4, 1.5, 6.5);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ReinhardToneMapping;
renderer.toneMappingExposure = 1.4;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.25;
controls.minDistance = 2.5;
controls.maxDistance = 18;
if (CAPTURE) controls.autoRotate = false;

// Lights
scene.add(new THREE.AmbientLight(0x112244, 0.8));
const light1 = new THREE.PointLight(0x00E5FF, 5, 30); light1.position.set(5,5,5); scene.add(light1);
const light2 = new THREE.PointLight(0xff00aa, 3.5, 25); light2.position.set(-5,-2,-3); scene.add(light2);
const light3 = new THREE.PointLight(0xffd700, 2, 18); light3.position.set(0,-4,6); scene.add(light3);

// Starfield
const starsGeo = new THREE.BufferGeometry();
const starCount = 4000;
const starPos = new Float32Array(starCount * 3);
for (let i = 0; i < starCount; i++) {
  const r = 15 + Math.random() * 45;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
  starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  starPos[i*3+2] = r * Math.cos(phi);
}
starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({
  size: 0.04, color: 0xffffff, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending
}));
scene.add(stars);

// ─── CUBE BRAIN ─────────────────────────────────
const brainGroup = new THREE.Group();
scene.add(brainGroup);
const cubeSize = 2.2;
let circuitTex = makeCircuitTexture(1024, 'rgba(0,229,255,0.8)', 0.3);
circuitTex.wrapS = circuitTex.wrapT = THREE.RepeatWrapping;
const faceMats = [];
for (let i = 0; i < 6; i++) {
  faceMats.push(new THREE.MeshPhongMaterial({
    map: circuitTex, color: 0x00E5FF, emissive: 0x003366, emissiveIntensity: 0.4,
    transparent: true, opacity: 0.45, shininess: 10, specular: 0x00aacc,
  }));
}
const cube = new THREE.Mesh(new THREE.BoxGeometry(cubeSize, cubeSize, cubeSize), faceMats);
brainGroup.add(cube);

// Edge glow
function makeEdgeGlow(size, color) {
  const group = new THREE.Group();
  const h = size / 2;
  const edges = [
    [[-h,-h,h],[-h,h,h]],[[h,-h,h],[h,h,h]],[[-h,-h,-h],[-h,h,-h]],[[h,-h,-h],[h,h,-h]],
    [[-h,h,-h],[-h,h,h]],[[h,h,-h],[h,h,h]],[[-h,h,-h],[h,h,-h]],[[-h,h,h],[h,h,h]],
    [[-h,-h,-h],[-h,-h,h]],[[h,-h,-h],[h,-h,h]],[[-h,-h,-h],[h,-h,-h]],[[-h,-h,h],[h,-h,h]],
  ];
  edges.forEach(([a,b]) => {
    const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(...a), new THREE.Vector3(...b)]);
    group.add(new THREE.Line(g, new THREE.LineBasicMaterial({color, transparent:true, opacity:0.7, blending:THREE.AdditiveBlending})));
    const aa = new THREE.Vector3(...a).multiplyScalar(1.015);
    const bb = new THREE.Vector3(...b).multiplyScalar(1.015);
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([aa,bb]), new THREE.LineBasicMaterial({color, transparent:true, opacity:0.25, blending:THREE.AdditiveBlending})));
  });
  return group;
}
const edgeGlow = makeEdgeGlow(cubeSize, T.accent);
brainGroup.add(edgeGlow);

// Internal circuit lines
const circuitLines = new THREE.Group();
for (let i = 0; i < 60; i++) {
  const v = new THREE.Vector3((Math.random()-0.5)*cubeSize*0.9, (Math.random()-0.5)*cubeSize*0.9, (Math.random()-0.5)*cubeSize*0.9);
  const end = v.clone().add(new THREE.Vector3((Math.random()-0.5)*1.8, (Math.random()-0.5)*1.8, (Math.random()-0.5)*1.8));
  circuitLines.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([v, end]), new THREE.LineBasicMaterial({color:T.accent, transparent:true, opacity:0.2+Math.random()*0.25, blending:THREE.AdditiveBlending})));
}
brainGroup.add(circuitLines);

// Surface nodes
const nodeGroup = new THREE.Group();
const surfaceNodes = [];
for (let i = 0; i < 100; i++) {
  const face = Math.floor(Math.random() * 6);
  const s = cubeSize / 2 * 1.005;
  const u = (Math.random()-0.5)*(cubeSize-0.2);
  const v = (Math.random()-0.5)*(cubeSize-0.2);
  let pos;
  switch(face) {
    case 0: pos = new THREE.Vector3(u, v, s); break;
    case 1: pos = new THREE.Vector3(u, v, -s); break;
    case 2: pos = new THREE.Vector3(s, u, v); break;
    case 3: pos = new THREE.Vector3(-s, u, v); break;
    case 4: pos = new THREE.Vector3(u, s, v); break;
    case 5: pos = new THREE.Vector3(u, -s, v); break;
  }
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.025, 6, 6), new THREE.MeshBasicMaterial({color:T.accent, blending:THREE.AdditiveBlending}));
  dot.position.copy(pos);
  dot.userData = { basePos: pos.clone(), phase: Math.random()*Math.PI*2 };
  surfaceNodes.push(dot);
  nodeGroup.add(dot);
}
brainGroup.add(nodeGroup);

// ─── HELIX LADDERS ──────────────────────────────
const helixGroup = new THREE.Group();
scene.add(helixGroup);
function makeHelixLadder(radius, height, turns, color, segments) {
  const group = new THREE.Group();
  const pts1 = [], pts2 = [];
  for (let i = 0; i <= segments; i++) {
    const t = (i/segments) * Math.PI * 2 * turns;
    const y = (i/segments) * height - height/2;
    pts1.push(new THREE.Vector3(Math.cos(t)*radius, y, Math.sin(t)*radius));
    pts2.push(new THREE.Vector3(Math.cos(t+Math.PI)*radius*0.85, y, Math.sin(t+Math.PI)*radius*0.85));
  }
  const mat = new THREE.LineBasicMaterial({color, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending});
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts1), mat));
  group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts2), mat));
  const rungMat = new THREE.LineBasicMaterial({color, transparent:true, opacity:0.2, blending:THREE.AdditiveBlending});
  for (let i = 0; i < pts1.length; i += 8)
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([pts1[i], pts2[i]]), rungMat));
  return group;
}
const ladder1 = makeHelixLadder(1.85, 3.5, 4.5, T.accent2, 400);
helixGroup.add(ladder1);
const ladder2 = makeHelixLadder(2.1, 3.8, 4.5, T.accent, 400);
ladder2.rotation.y = Math.PI / 2;
helixGroup.add(ladder2);

function makeOrbitRing(radius, color, tiltX, tiltZ) {
  const pts = [];
  for (let i = 0; i <= 400; i++) {
    const a = (i/400) * Math.PI * 2;
    pts.push(new THREE.Vector3(Math.cos(a)*radius, Math.sin(a)*radius*0.12, 0));
  }
  const ring = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color, transparent:true, opacity:0.45, blending:THREE.AdditiveBlending}));
  ring.rotation.x = tiltX; ring.rotation.z = tiltZ;
  ring.userData = { sx: (Math.random()-0.5)*0.4, sz: (Math.random()-0.5)*0.4 };
  return ring;
}
const rings = [
  makeOrbitRing(2.5, T.accent, Math.PI/3, 0),
  makeOrbitRing(2.6, T.accent2, -Math.PI/4, Math.PI/5),
  makeOrbitRing(2.7, T.accent3, 0, Math.PI/6),
  makeOrbitRing(2.4, T.accent, -Math.PI/6, -Math.PI/8),
];
rings.forEach(r => helixGroup.add(r));

// ─── MESH NODES GROUP (real data) ───────────────
const meshGroup = new THREE.Group();
scene.add(meshGroup);
scene.add(linkGroup);

// ─── PULSES ─────────────────────────────────────
function firePulse(origin) {
  const pulse = new THREE.Mesh(
    new THREE.RingGeometry(0.03, 0.12, 32),
    new THREE.MeshBasicMaterial({color:T.accent, side:THREE.DoubleSide, transparent:true, opacity:1, blending:THREE.AdditiveBlending})
  );
  pulse.position.copy(origin);
  pulse.userData = { scale: 0.05, speed: 0.1, opacity: 1 };
  scene.add(pulse);
  pulseWaves.push(pulse);
}
window.firePulse = firePulse;

// Click → pulse + walk
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let hovered = null;
let walkHighlights = [];   // active walk animation nodes
let walkTrails = [];       // trail lines for walk activation

function onPointerMove(e) {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(meshGroup.children);
  const tt = document.getElementById('tooltip');
  if (hits.length) {
    const h = hits[0].object;
    const node = nodeMap[h.userData.nodeId];
    if (node && node.data) {
      const d = node.data;
      tt.style.display = 'block';
      tt.innerHTML = `<div class="tt-id">#${d.id}</div><div class="tt-content">${escapeHtml(d.content.slice(0, 140))}</div><div class="tt-meta">${d.lane} lane · trust ${d.trust} · ${d.provenance}</div>`;
      tt.style.left = (e.clientX + 14) + 'px';
      tt.style.top = (e.clientY + 14) + 'px';
      hovered = h;
      document.body.style.cursor = 'pointer';
      return;
    }
  }
  tt.style.display = 'none';
  hovered = null;
  document.body.style.cursor = 'default';
}
function onPointerDown(e) {
  pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(meshGroup.children);
  if (hits.length) {
    const obj = hits[0].object;
    firePulse(obj.position.clone());
    // Run associative walk from this node
    const nid = obj.userData.nodeId;
    if (nid) runWalk(nid);
  } else {
    const v = new THREE.Vector3(pointer.x, pointer.y, 0.5).unproject(camera);
    const dir = v.sub(camera.position).normalize();
    firePulse(camera.position.clone().add(dir.multiplyScalar(4)));
  }
}

// ─── ASSOCIATIVE WALK (brain interaction) ───────
function runWalk(nodeId) {
  // Clear previous walk
  clearWalk();
  fetch('/brain/walk', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({node_id: nodeId, hops: 2, top_n: 12})
  }).then(r => r.json()).then(data => {
    if (!data.path || !data.path.length) return;
    const total = data.path.length;
    const delay = 180; // ms between each node highlight
    data.path.forEach((step, i) => {
      setTimeout(() => {
        highlightWalkNode(step, i);
        // Trail from previous node
        if (i > 0) drawWalkTrail(data.path[i-1].node_id, step.node_id);
      }, i * delay);
    });
  }).catch(e => console.warn('walk:', e.message));
}

function highlightWalkNode(step, index) {
  const entry = nodeMap[step.node_id];
  if (!entry) return;
  const m = entry.three;
  // Flash the node bright white
  const origColor = m.material.color.getHex();
  const pulse = new THREE.Mesh(
    new THREE.SphereGeometry(m.geometry.parameters.radius * 3.5, 16, 16),
    new THREE.MeshBasicMaterial({color: 0x00E5FF, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending})
  );
  pulse.position.copy(m.position);
  pulse.userData = { scale: 1, opacity: 0.9, target: pulse };
  scene.add(pulse);
  walkHighlights.push(pulse);
  // Distance-based coloring
  const distColors = {0: 0xffd700, 1: 0x00E5FF, 2: 0x4dabf7, 3: 0x9775fa};
  const clr = distColors[step.distance] || 0xffffff;
  m.material.emissive = new THREE.Color(clr);
  m.material.emissiveIntensity = 1.5;
  // Reset after 2.5s
  setTimeout(() => {
    m.material.emissive = new THREE.Color(entry.data.color);
    m.material.emissiveIntensity = 0.55;
  }, 2500);
}

function drawWalkTrail(fromId, toId) {
  const a = nodeMap[fromId], b = nodeMap[toId];
  if (!a || !b) return;
  const geo = new THREE.BufferGeometry().setFromPoints([a.three.position, b.three.position]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: 0xffd700, transparent: true, opacity: 0.8,
    blending: THREE.AdditiveBlending, linewidth: 1
  }));
  scene.add(line);
  walkTrails.push(line);
  // Fade trail after 4s
  setTimeout(() => {
    line.material.opacity = 0;
    setTimeout(() => { scene.remove(line); }, 800);
  }, 4000);
}

function clearWalk() {
  walkHighlights.forEach(p => {
    scene.remove(p);
    if (p.geometry) p.geometry.dispose();
  });
  walkHighlights = [];
  walkTrails.forEach(l => {
    scene.remove(l);
    if (l.geometry) l.geometry.dispose();
  });
  walkTrails = [];
  // Reset all node emissives
  for (const id in nodeMap) {
    const m = nodeMap[id].three;
    m.material.emissive = new THREE.Color(nodeMap[id].data.color);
    m.material.emissiveIntensity = 0.55;
  }
}
function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
window.addEventListener('pointermove', onPointerMove, { passive: true });
window.addEventListener('pointerdown', onPointerDown, { passive: true });
window.closeMobileDetail = () => document.getElementById('mobile-detail').classList.remove('open');

// ─── ANIMATION ──────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);
  const t = performance.now() * 0.001;
  if (CAPTURE) {
    const a = t * 0.12;
    const r = 7.2 - t * 0.12;
    camera.position.set(Math.cos(a) * r * 0.85, 1.2 + Math.sin(t * 0.35) * 0.8, Math.sin(a) * r * 0.85 + 1.2);
    camera.lookAt(0, 0, 0);
    if (Math.floor(t / 1.6) > (window.__lastPulseT || -1)) {
      window.__lastPulseT = Math.floor(t / 1.6);
      firePulse(new THREE.Vector3((Math.random()-0.5)*3.4, (Math.random()-0.5)*2.4, (Math.random()-0.5)*3.4));
    }
  }
  if (!frozen) {
    surfaceNodes.forEach(n => {
      const s = 1 + Math.sin(t*2.2 + n.userData.phase) * 0.06;
      n.position.copy(n.userData.basePos).multiplyScalar(s);
      n.material.opacity = 0.3 + Math.sin(t*3 + n.userData.phase) * 0.3;
    });
    // Real mesh nodes: gentle breathing
    for (const id in nodeMap) {
      const m = nodeMap[id].three;
      m.scale.setScalar(1 + Math.sin(t*2.2 + m.userData.phase)*0.15);
    }
    rings.forEach(r => { r.rotation.x += dt * r.userData.sx; r.rotation.z += dt * r.userData.sz; });
    ladder1.rotation.y += dt * 0.12;
    ladder2.rotation.y -= dt * 0.1;
    ladder2.rotation.x += dt * 0.05;
    brainGroup.rotation.y += dt * 0.12;
    brainGroup.rotation.x += dt * 0.03;
    stars.rotation.y += dt * 0.015;
    stars.rotation.x += dt * 0.003;
    const breath = 1 + Math.sin(t*1.3)*0.25;
    light1.intensity = 5 * breath;
    light2.intensity = 3.5 * breath;
  }
  pulseWaves = pulseWaves.filter(p => {
    p.userData.scale += p.userData.speed;
    p.userData.opacity -= 0.012;
    if (p.userData.opacity <= 0) { scene.remove(p); return false; }
    p.scale.setScalar(p.userData.scale);
    p.material.opacity = p.userData.opacity;
    return true;
  });
  controls.update();
  renderer.render(scene, camera);
}

// ─── INIT ───────────────────────────────────────
fetchMesh();
setInterval(fetchMesh, 30000); // live refresh every 30s
animate();
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
