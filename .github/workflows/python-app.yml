# GitHub Actions — NEURAL_MESH CI

name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Core tests (unittest — pure stdlib, no deps)
        run: |
          PYTHONPATH=. python -m unittest discover -s tests -v -q 2>&1
      - name: Security tests (stdlib only)
        run: |
          PYTHONPATH=. python -m unittest tests.test_security -v 2>&1
      - name: Reputation tests (stdlib only)
        run: |
          PYTHONPATH=. python -m unittest tests.test_reputation -v 2>&1

  server-tests:
    runs-on: ubuntu-latest
    needs: core-tests
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Flask
        run: pip install Flask
      - name: Server tests
        run: |
          PYTHONPATH=. python -m unittest tests.test_server_lifecycle tests.test_server_operations -v 2>&1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install linter
        run: pip install flake8
      - name: Flake8 syntax checks
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Flake8 style (warnings)
        run: |
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
